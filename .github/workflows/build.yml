name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Auto Update Version
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"

          sed -i "s/versionCode = [0-9]\+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      - name: Update Application ID Automatically
        run: |
          sed -i 's/applicationId = .*/applicationId = "com.vedra.ai"/' app/build.gradle.kts

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION_CODE=${{ github.run_number }}
          mv app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/VEDRA-v1.0.$VERSION_CODE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDRA-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/VEDRA-v1.0.${{ github.run_number }}.apk
        
