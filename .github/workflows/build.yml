name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Force Headless Mode for Kotlin and KSP
        run: |
          echo "org.gradle.jvmargs=-Xmx3200m -Djava.awt.headless=true" >> gradle.properties
          echo "kotlin.daemon.jvm.options=-Djava.awt.headless=true" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDRA-App
          path: app/build/outputs/apk/debug/*.apk
          
