name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Auto-Update Application ID & Version
        run: |
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/applicationId = .*/applicationId = \"com.vedra.ai\"/" app/build.gradle.kts || true
          sed -i "s/versionCode = .*/versionCode = ${BUILD_NUM}/" app/build.gradle.kts || true
          sed -i "s/versionName = .*/versionName = \"1.0.${BUILD_NUM}\"/" app/build.gradle.kts || true

      - name: Setup Default Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEDRA-App
          path: app/build/outputs/apk/debug/*.apk
          
