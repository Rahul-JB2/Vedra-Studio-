Name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Update Application ID Automatically
        run: |
          sed -i 's/applicationId = .*/applicationId = "com.vedra.ai"/' app/build.gradle.kts

      - name: Auto-Bump Version Code and Version Name
        run: |
          BUILD_NUM=${{ github.run_number }}
          # Version Code ko update karein
          sed -i "s/versionCode = .*/versionCode = ${BUILD_NUM}/" app/build.gradle.kts
          # Version Name ko update karein (e.g., 1.0.1, 1.0.2...)
          sed -i "s/versionName = .*/versionName = \"1.0.${BUILD_NUM}\"/" app/build.gradle.kts

      - name: Generate Dummy Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Build APK with Fake Screen
        run: |
          sudo apt-get install -y xvfb
          xvfb-run gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDRA-App
          path: app/build/outputs/apk/debug/*.apk
          
