name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Dummy Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Generate Dummy google-services.json
        run: |
          echo '{
            "project_info": { "project_number": "1234", "project_id": "dummy" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:1234:android:abcd", "android_client_info": { "package_name": "com.example" } }, "api_key": [ { "current_key": "dummy" } ] } ],
            "configuration_version": "1"
          }' > app/google-services.json

      - name: Build APK with Fake Screen
        run: |
          sudo apt-get install -y xvfb
          xvfb-run gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDRA-App
          path: app/build/outputs/apk/debug/*.apk
          
